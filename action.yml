name: "WikiLeet"
description: "Automatically parse your LeetCode submissions and generate a navigatable wiki of your solutions"
author: "Zanger67"

branding:
    icon: "book-open"
    color: "yellow"

inputs:
    username:
        description: |
            'Your LeetCode username'
            'Default: Zanger'
        default: "Zanger"
    contest-dir:
        description: |
            'Extra contest container directories (comma-separated), relative to'
            'your repo's root. Each container's immediate subfolders are treated'
            'as individual contests. Folders named "contest"/"contests" are'
            'auto-detected anywhere in the repo, so this is only for additional'
            'containers that use a different name.'
            'Default: (none)'
        default: ""

runs:
    using: "composite"
    steps:
        - name: Checkout the current repository content
          uses: actions/checkout@v2
          with:
              # Fetch all commits since init so we can trace each file's
              # first commit timestamp. If not for this, the date for
              # every single file will default to the most recent
              # commit date since there's nothing to trace.
              fetch-depth: 0

              # Markdown generator is found in submodule + data submodule
              submodules: "true"

        - name: Pull current version of markdown generator | Cloning if not present
          shell: bash
          run: |
              git clone --recurse-submodules https://github.com/Zanger67/WikiLeet.git '.readme_updater'

              cd .readme_updater
              echo "Initializing and updating submodules in case checkout resulted in uninitializations..."
              git submodule update --init --recursive
              git submodule update --recursive --remote
              cd ../

        - name: Setup python 3.10
          uses: actions/setup-python@v4
          with:
              python-version: "3.10"
              cache: "pip"

          # Dependencies for the markdown generator
        - name: Install python packages
          shell: bash
          run: |
              python -m pip install --upgrade pip
              pip install -r '.readme_updater/requirements.txt'

        - name: Generate the markdown files and commit them to the repo
          shell: bash
          # -n: ignores previous .pkl stores of the modified dates (regenerate all from scratch)
          # -g: use github log history to determine creation and modification dates of files
          # -user: specify the username for the LeetCode account
          #
          # Note: exit 0 on the commit should be redundant since this action triggers on a
          #       modification meaning at least one file edit, but might as well keep it in
          #       case of future changes
          #
          #       Only exception I can think of is if you make a change in one commit
          #       then revert it in the next
          run: |
              git config --global user.name "Zanger67/leetcode"
              git config --global user.email "Zanger67[bot]@Zanger67.github.io"

              for attempt in 1 2 3; do
                  python '.readme_updater/main.py' -n -g -user "${{ inputs.username }}" -contest-dir "${{ inputs['contest-dir'] }}"

                  git add -- . ':!.readme_updater'
                  git commit -m 'Updated markdown files' || exit 0

                  if git push; then
                      exit 0
                  fi

                  echo "Push rejected on attempt $attempt/3 - another run of this action pushed first."
                  echo "Re-syncing to origin/${{ github.ref_name }} and regenerating from the updated tree..."
                  git fetch origin '${{ github.ref_name }}'
                  git reset --hard 'origin/${{ github.ref_name }}'
              done

              echo "::error::Failed to push the generated markdown after 3 attempts."
              exit 1
